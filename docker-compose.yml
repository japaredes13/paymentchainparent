## YAML Template.
---
services:
  registry-discovery:
    container_name: id-eureka
    image: paymentchain/microservice-docker-eurekaserver:0.0.1-SNAPSHOT
    ports:
      - 8761:8761
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M

##########################################################################
#configuration service
##########################################################################
  configuration:
    container_name: id-config
    image: paymentchain/microservice-docker-configserver:0.0.1-SNAPSHOT
    volumes:
      #this it uses because we are using a local GitHub repository /host/path:/container/path use ./ for relative path
      - ./config-server-repo:/tmp/config-server-repo
      #All projets will have a variable value  DEUREKA_SERVER this tell where find a registry-discovery server
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/
        -DLOCAL_REPOSITORY=/tmp/config-server-repo
      #-Dspring.cloud.config.server.native.searchLocations=/var/config-data
    depends_on:
      - registry-discovery
    ports:
      - 8888:8888

##########################################################################
#administration service
##########################################################################
  administration:
    container_name: id-admin
    image: paymentchain/microservice-docker-springadmin:0.0.1-SNAPSHOT
    #All projets will have a variable value  DEUREKA_SERVER this tell where find a registry-discovery server
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/
      #-Dspring.cloud.config.server.native.searchLocations=/var/config-data
    depends_on:
      - registry-discovery
    ports:
      - 8762:8762

##########################################################################
#apigateway service
##########################################################################
  apigateway:
    container_name: id-apigateway
    image: paymentchain/microservice-docker-apigateway:0.0.1-SNAPSHOT
    #All projets will have a variable value  DEUREKA_SERVER this tell where find a registry-discovery server
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/
      #-Dspring.cloud.config.server.native.searchLocations=/var/config-data
    depends_on:
      - registry-discovery
    ports:
      - 8080:8080

##########################################################################
#product service
##########################################################################
  product-catalog:
    container_name: bd-product-catalog
    image: paymentchain/microservice-docker-product:0.0.1-SNAPSHOT
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/
    depends_on:
      - registry-discovery
    ports:
      - 8083:8083

##########################################################################
#transaction service
##########################################################################
  transactions:
    container_name: bd-transactions
    image: paymentchain/microservice-docker-transaction:0.0.1-SNAPSHOT
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/
        -Dspring.profiles.active=development
    depends_on:
      - registry-discovery
      - configuration
    ports:
      - 8082:8082

  customer:
    container_name: bd-customer
    image: paymentchain/microservice-docker-customer:0.0.1-SNAPSHOT
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/

    depends_on:
      - registry-discovery

##########################################################################
#keycloack service
##########################################################################
  keycloak:
    container_name: keycloak-adapter
    image: paymentchain/microservice-docker-keycloakadapter:0.0.1-SNAPSHOT
    #All projets will have a variable value  DEUREKA_SERVER this tell where find a registry-discovery server
    environment:
      - JAVA_OPTS=
        -Xms256M
        -Xmx256M
        -DEUREKA_SERVER=http://registry-discovery:8761/eureka/
        -DKEYCLOAK_SERVER=http://keycloak_server:8080/realms/
        -DKEYCLOAK_REAL_ID=OHBI8b9ysK1XZEjUufNSXDNDisPfXvNQHuHtYx9CBmA
      #-Dspring.cloud.config.server.native.searchLocations=/var/config-data
    depends_on:
      - registry-discovery
    ports:
      - 8088:8088

  postgres_db:
    container_name: postgres
    image: postgres:latest
    ports:
      - 5432:5432
    volumes:
      - ./dbfiles:/docker-entrypoint-initdb.d
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: postgres


##########################################################################
#keycloack Server
##########################################################################
  keycloak_server:
    container_name: keycloak-server
    image: quay.io/keycloak/keycloak:25.0.1
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      DB_VENDOR: H2
    ports:
      - 8091:8080
    command: start-dev